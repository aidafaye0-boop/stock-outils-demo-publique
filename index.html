<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Démo Stock outils</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : réplique allégée de l'écran Dolibarr (bandeau marine + pages), thème clair unique comme l'application réelle */
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #17202c;
  --muted: #5d6877;
  --line: #dde1e6;
  --navy: #263c5c;
  --navy-soft: #e7ecf3;
  --red: #d03b3b;
  --red-btn: #b8322f;
  --yellow: #fab219;
  --green: #0ca30c;
  --green-btn: #1f7a1f;
  --grey: #8a8a86;
  --blue: #2a78d6;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; background: linear-gradient(180deg, #eef2f7 0, var(--bg) 320px) no-repeat, var(--bg); -webkit-font-smoothing: antialiased; }
:root { --shadow: 0 1px 2px rgba(23,32,44,.06), 0 6px 18px rgba(23,32,44,.07); --shadow-hover: 0 2px 4px rgba(23,32,44,.08), 0 10px 26px rgba(23,32,44,.12); --radius: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.demo-note { background: #fff4d6; color: #5a4300; font-size: 13.5px; padding-block: 8px; text-align: center; }
.demo-note button { font: inherit; background: none; border: 0; color: #5a4300; text-decoration: underline; cursor: pointer; padding: 0 4px; }

.topbar { background: linear-gradient(180deg, #2c4568, var(--navy)); box-shadow: 0 2px 10px rgba(23,32,44,.25); color: #fff; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.topbar .in { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding-block: 8px; }
.brand { font-weight: 700; letter-spacing: .01em; margin-right: 10px; white-space: nowrap; }
.brand small { font-weight: 400; opacity: .7; margin-left: 6px; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav a { color: #dfe7f2; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-weight: 500; font-size: 14.5px; transition: background .15s, color .15s; }
nav a:hover { background: rgba(255,255,255,.1); }
nav a.on { background: #fff; color: var(--navy); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
nav a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

main { max-width: 1120px; margin: 0 auto; padding-block: 26px 60px; display: flex; flex-direction: column; gap: 22px; }
h1 { font-size: 24px; margin: 0; color: var(--navy); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 17px; margin: 0; color: var(--navy); font-weight: 600; }
p { margin: 0; }
a { color: #1f5fb4; }
a:hover { color: #174a8c; }
.muted { color: var(--muted); }
.intro { max-width: 70ch; color: var(--muted); }

.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.box > .hd { background: #f3f5f8; padding: 12px 18px; font-weight: 600; color: var(--navy); border-bottom: 1px solid var(--line); }
.box > .bd { padding: 14px 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; align-items: start; }

.shortcuts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.shortcuts a { display: flex; flex-direction: column; gap: 4px; padding: 16px 14px; border-radius: 12px; text-decoration: none; background: #eef1f5; color: var(--ink); transition: transform .12s, box-shadow .12s; }
.shortcuts a:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.shortcuts a.main { background: var(--navy); color: #fff; }
.shortcuts b { font-size: 16px; }
.shortcuts span { font-size: 13px; opacity: .8; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.tile { background: #eef1f5; border-radius: 12px; padding: 12px 14px; }
.tile b { display: block; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); }

/* Scan */
.scanwrap { max-width: 760px; display: flex; flex-direction: column; gap: 16px; }
.banner { display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 12px; font-size: 15.5px; box-shadow: var(--shadow); }
.banner .ic { font-size: 24px; line-height: 1; }
.banner .grow { flex: 1; min-width: 0; }
.banner.ok { background: #e9f7e9; border-left: 8px solid var(--green); }
.banner.ko { background: #fbeaea; border-left: 8px solid var(--red); }
.banner.warn { background: #fff6e0; border-left: 8px solid var(--yellow); }
.btn-undo { background: #fff; border: 1px solid #999; border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.zone { border: 3px dashed #b9b9b4; border-radius: 18px; box-shadow: var(--shadow); padding: 24px 18px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; background: var(--surface); }
.zone.out { border-color: var(--red-btn); background: #fdf4f4; }
.zone.in { border-color: var(--green-btn); background: #f2faf2; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
.sens button { font: inherit; font-weight: 600; padding: 9px 18px; border: 2px solid #bbb; border-radius: 10px; background: #fff; cursor: pointer; color: var(--ink); }
.sens button.on.o { background: var(--red-btn); border-color: var(--red-btn); color: #fff; }
.sens button.on.i { background: var(--green-btn); border-color: var(--green-btn); color: #fff; }
select { font: inherit; font-size: 16px; height: 42px; min-width: 190px; padding: 0 10px; border: 1px solid #c9cfd8; border-radius: 10px; background: #fff; color: var(--ink); }
.state { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); }
.zone.in .dot { background: var(--green); }
.code { font: inherit; font-size: 22px; padding: 10px 14px; width: 100%; max-width: 420px; text-align: center; border: 1px solid #c9cfd8; border-radius: 10px; box-shadow: inset 0 1px 2px rgba(23,32,44,.05); background: #fff; color: var(--ink); }
.try { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.try .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.try button { font-family: var(--font-mono); font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--ink); }
.try button:hover { border-color: var(--navy); }
.help { color: var(--muted); font-size: 14px; max-width: 60ch; }
.cands { display: flex; flex-direction: column; }
.cands button { text-align: left; font: inherit; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--ink); }

/* Tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th { text-align: left; font-weight: 600; color: var(--muted); background: #f3f5f8; padding: 11px 14px; white-space: nowrap; }
td { padding: 10px 14px; border-top: 1px solid #e8ebef; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.r td { background: #fcf1f1; } tr.y td { background: #fffaee; }
.pill { display: inline-block; padding: 3px 11px; border-radius: 12px; font-size: 13px; font-weight: 600; color: #fff; }
.pill.r { background: var(--red); } .pill.y { background: var(--yellow); color: #17202c; } .pill.g { background: var(--green); } .pill.n { background: var(--grey); }
.qplus { color: var(--green-btn); font-weight: 600; } .qmin { color: var(--red-btn); font-weight: 600; }

.qty { width: 90px; height: 42px; padding: 0 10px; font: inherit; font-size: 20px; text-align: center; border: 1px solid #c9cfd8; border-radius: 10px; background: #fff; color: var(--ink); box-shadow: inset 0 1px 2px rgba(23,32,44,.05); }

/* Filigrane « Version test » (comme lib/rmecastock.lib.php dans le module) */
.rm-test-wm { position: fixed; top: 52%; left: 50%; transform: translate(-50%, -50%) rotate(-24deg); font-size: min(13vw, 150px); font-weight: 700; letter-spacing: .08em; white-space: nowrap; color: rgba(208,59,59,.11); pointer-events: none; user-select: none; z-index: 9999; }
.rm-test-strip { background: #fff6e0; border-left: 6px solid #fab219; padding: 8px 14px; margin: 14px 0 0; border-radius: 6px; font-size: 14.5px; }

/* Saisie rapide */
.inv input { width: 80px; text-align: right; font: inherit; font-size: 15px; padding: 4px 6px; border: 1px solid #bbb; border-radius: 6px; background: #fff; color: var(--ink); }
.inv input.changed { background: #fff7d6; border-color: #fab219; }
.btn-save { font: inherit; font-weight: 600; padding: 11px 26px; border: 0; border-radius: 10px; background: var(--navy); color: #fff; cursor: pointer; box-shadow: 0 2px 8px rgba(23,32,44,.22); transition: filter .15s, transform .05s; }
.btn-save:hover { filter: brightness(1.12); } .btn-save:active { transform: translateY(1px); }
.btn-undo { transition: box-shadow .15s, background .15s; } .btn-undo:hover { box-shadow: 0 2px 8px rgba(23,32,44,.18); }
.sens button { transition: filter .15s; } .sens button:hover { filter: brightness(.96); }
tbody tr:hover td { background: #f3f7fc; }
tr.r:hover td { background: #f9e6e6; } tr.y:hover td { background: #fff3d9; }

/* Charts */
.charts { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.donutleg { display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; margin-top: 10px; }
svg text { font-family: var(--font-body); }
.restock li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.restock { list-style: none; margin: 0; padding: 0; }
.bar { display: grid; grid-template-columns: 120px 1fr 24px; gap: 8px; align-items: center; font-size: 14px; padding: 3px 0; }
.bar .track { background: #eef0f3; border-radius: 4px; height: 14px; overflow: hidden; }
.bar .fill { background: var(--blue); height: 100%; border-radius: 4px; }

/* Captures */
.shots { display: flex; flex-direction: column; gap: 30px; }
.shot { display: flex; flex-direction: column; gap: 8px; }
.shot a { display: block; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.shot img { display: block; width: 100%; height: auto; }

@media (max-width: 760px) {
  .charts { grid-template-columns: minmax(0, 1fr); }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="demo-note gutter" role="note"><b>Démonstration · données fictives</b> — les mouvements faits ici restent dans votre navigateur. <button type="button" id="reset">Remettre la démo à zéro</button></div>
<header class="topbar gutter">
  <div class="in">
    <span class="brand">Stock outils<small>Démonstration</small></span>
    <nav aria-label="Pages">
      <a href="#accueil" data-v="accueil">Accueil</a>
      <a href="#scan" data-v="scan">Scan entrée / sortie</a>
      <a href="#seuils" data-v="seuils">Tableau des seuils</a>
      <a href="#utilisation" data-v="utilisation">Utilisation des outils</a>
      <a href="#saisie" data-v="saisie">Saisie rapide</a>
      <a href="#historique" data-v="historique">Historique</a>
    </nav>
  </div>
</header>
<div class="gutter"><div class="rm-test-strip" role="note"><b>Version test</b> : outil en phase d'essai, pas encore utilisé en production.</div></div>
<div class="rm-test-wm" aria-hidden="true">VERSION TEST</div>
<main class="gutter" id="view"></main>

<script>
(function () {
  var NEAR = 1.5;
  var MACHINES = ["Fraiseuse 1", "Fraiseuse 2", "Tour 1", "Tour 2"];
  var INITIAL_TOOLS = [
    ["0101", 8, "Fraise 2 tailles Ø6"], ["0102", 3, "Fraise 2 tailles Ø8"], ["0103", 12, "Fraise torique Ø10"], ["0104", 7, "Foret carbure Ø5"],
    ["0105", 5, "Foret carbure Ø8"], ["0106", 2, "Plaquette CNMG"], ["0107", 11, "Plaquette DNMG"], ["0108", 6, "Taraud M6"],
    ["0109", 4, "Taraud M8"], ["0110", 9, "Alésoir Ø10"], ["0111", 1, "Fraise à rainurer Ø12"], ["0112", 7, "Fraise boule Ø6"],
    ["0113", 5, "Outil à fileter"], ["0114", 3, "Barre d'alésage"], ["0115", 10, "Foret à centrer"], ["0116", 6, "Fraise à chanfreiner"]
  ];
  var INITIAL_MOVES = [
    ["2026-11-08T16:12:45", "0102", -1, "Sortie scan - Machine : Tour 1"],
    ["2026-11-08T15:06:25", "0108", 1, "Entrée scan - Machine : Fraiseuse 1"],
    ["2026-11-08T14:56:59", "0111", -1, "Sortie scan - Machine : Fraiseuse 2"],
    ["2026-11-08T14:56:50", "0107", 2, "Entrée scan - Machine : Tour 2"],
    ["2026-11-08T11:40:10", "0104", -1, "Sortie scan - Machine : Fraiseuse 1"],
    ["2026-11-08T09:05:30", "0106", -1, "Sortie scan - Machine : Tour 1"]
  ];
  var KEY = "stock-outils-demo-v1";
  // [jours en arrière, heure, outil, quantité, libellé] : sorties plus anciennes (fictives) pour le classement d'utilisation
  var EXTRA_MOVES = [
    [2, 10, "0103", -2, "Sortie OF 4821 - Machine : Fraiseuse 1"], [3, 14, "0105", -1, "Sortie scan - Machine : Tour 2"], [5, 9, "0103", -1, "Sortie scan - Machine : Fraiseuse 2"],
    [6, 15, "0107", -3, "Sortie OF 4817 - Machine : Tour 1"], [9, 11, "0103", -2, "Sortie OF 4809 - Machine : Fraiseuse 1"], [12, 8, "0109", -1, "Sortie scan - Machine : Fraiseuse 2"],
    [14, 13, "0107", -2, "Sortie OF 4802 - Machine : Tour 1"], [17, 10, "0105", -2, "Sortie OF 4795 - Machine : Tour 2"], [21, 16, "0103", -3, "Sortie OF 4788 - Machine : Fraiseuse 1"],
    [24, 9, "0110", -1, "Sortie scan - Machine : Fraiseuse 2"], [28, 14, "0107", -2, "Sortie OF 4776 - Machine : Tour 1"], [33, 11, "0103", -2, "Sortie OF 4761 - Machine : Fraiseuse 2"],
    [38, 15, "0105", -1, "Sortie scan - Machine : Tour 2"], [45, 10, "0108", -1, "Sortie scan - Machine : Fraiseuse 1"], [52, 9, "0103", -4, "Sortie OF 4722 - Machine : Fraiseuse 1"],
    [58, 14, "0107", -2, "Sortie OF 4710 - Machine : Tour 1"], [66, 11, "0114", -1, "Sortie scan - Machine : Tour 2"], [74, 15, "0105", -2, "Sortie OF 4685 - Machine : Tour 2"],
    [81, 10, "0103", -3, "Sortie OF 4660 - Machine : Fraiseuse 2"], [88, 9, "0116", -1, "Sortie scan - Machine : Fraiseuse 1"]
  ];
  function extraMoves() {
    return EXTRA_MOVES.map(function (m) {
      var d = new Date(); d.setDate(d.getDate() - m[0]); d.setHours(m[1], 0, 0, 0); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return { t: d.toISOString().slice(0, 19), ref: "OUT-" + m[2], qty: m[3], label: m[4], who: "admin" };
    });
  }

  function fresh() {
    return {
      tools: INITIAL_TOOLS.map(function (t) { return { ref: "OUT-" + t[0], label: t[2], stock: t[1], seuil: 4, desired: 10 }; }),
      moves: INITIAL_MOVES.map(function (m) { return { t: m[0], ref: "OUT-" + m[1], qty: m[2], label: m[3], who: "admin" }; }).concat(extraMoves()).sort(function (a, b) { return a.t < b.t ? 1 : -1; }),
      status: {},                                          // suivi de réapprovisionnement : ref → { statut, note, t }
      of: { no: "", sens: 1, machine: "", lines: [] }      // liste en cours du « Scan par OF »
    };
  }
  var STATUTS = ["À décider", "Devis demandé", "Commandé - attente réception"];
  var S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.tools) { S = fresh(); }
  if (!S.status) { S.status = {}; }
  if (!S.of) { S.of = { no: "", sens: 1, machine: "", lines: [] }; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  var ofFlash = null, ofResult = null, ofUndoInfo = null, ofCands = null;   // Scan entrée / sortie (liste)

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function tool(ref) { for (var i = 0; i < S.tools.length; i++) { if (S.tools[i].ref === ref) { return S.tools[i]; } } return null; }
  function status(t) {
    if (t.seuil <= 0) { return { k: "n", ic: "–", txt: "Pas de seuil" }; }
    if (t.stock < t.seuil) { return { k: "r", ic: "▼", txt: "Sous le seuil" }; }
    if (t.stock <= t.seuil * NEAR) { return { k: "y", ic: "▲", txt: "Proche du seuil" }; }
    return { k: "g", ic: "✓", txt: "OK" };
  }
  // Un outil revenu au-dessus de son seuil n'a plus de suivi de commande (comme rmeca_clean_statuts du module)
  function cleanStatus() {
    Object.keys(S.status).forEach(function (ref) { var t = tool(ref); if (!t || t.seuil <= 0 || t.stock >= t.seuil) { delete S.status[ref]; } });
  }
  var ORDER = { r: 0, y: 1, g: 2, n: 3 };
  function sorted() { return S.tools.slice().sort(function (a, b) { return ORDER[status(a).k] - ORDER[status(b).k] || a.ref.localeCompare(b.ref); }); }
  function fmtDate(iso) { var d = new Date(iso); function p(n) { return (n < 10 ? "0" : "") + n; } return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes()); }
  function nowIso() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 19); }

  function beep(ok) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      (ok ? [[660, 0, .09], [990, .1, .12]] : [[220, 0, .25]]).forEach(function (n) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = n[0]; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(.12, ctx.currentTime + n[1]);
        o.start(ctx.currentTime + n[1]); o.stop(ctx.currentTime + n[1] + n[2]);
      });
    } catch (e) {}
  }

  // Même logique que scan.php : 1 scan = 1 outil, sortie refusée si stock insuffisant
  function move(t, qty, sens, machine, prefix) {
    if (sens === 1 && qty > t.stock) {
      return { ok: false, msg: "Sortie refusée : il ne reste que " + t.stock + " × " + t.ref + " en stock." };
    }
    var before = t.stock;
    t.stock += sens === 1 ? -qty : qty;
    var label = (prefix || (sens === 1 ? "Sortie scan" : "Entrée scan")) + (machine ? " - Machine : " + machine : "");
    S.moves.unshift({ t: nowIso(), ref: t.ref, qty: sens === 1 ? -qty : qty, label: label, who: "vous (démo)" });
    cleanStatus();
    save();
    var r = { ok: true, msg: (sens === 1 ? "Sortie" : "Entrée") + " de " + qty + " × " + t.ref + (machine && sens === 1 ? " pour " + machine : "") + " enregistrée.", detail: "Stock : " + before + " → " + t.stock };
    if (t.seuil > 0 && t.stock < t.seuil) { r.warn = t.ref + " est sous son seuil (" + t.stock + " / mini " + t.seuil + ") : réapprovisionnement à prévoir."; }
    return r;
  }

  /* ---------- Vues ---------- */
  function vAccueil() {
    var today = nowIso().slice(0, 10), out = 0, inn = 0, nomach = 0;
    S.moves.forEach(function (m) {
      if (m.t.slice(0, 10) === today) { if (m.qty < 0) { out -= m.qty; } else { inn += m.qty; } }
      if (m.qty < 0 && m.label.indexOf("Machine : ") < 0 && m.t.slice(0, 10) === today) { nomach++; }
    });
    var under = S.tools.filter(function (t) { return status(t).k === "r"; }).length;
    var restock = sorted().filter(function (t) { var k = status(t).k; return k === "r" || k === "y"; });

    return '<h1>Accueil</h1>' +
      '<p class="intro">Démonstration de suivi des outils coupants pour un atelier d\'usinage. Chaque sortie ou retour d\'outil est scanné ; le stock et les alertes de seuil se mettent à jour tout seuls. Essayez la page <a href="#scan">Scan</a> : le tableau des seuils change en direct.</p>' +
      '<div class="grid2">' +
        '<div class="box"><div class="hd">Stock outils</div><div class="bd"><div class="shortcuts">' +
          '<a class="main" href="#scan"><b>Scanner</b><span>Entrée ou sortie d\'outils</span></a>' +
          '<a href="#seuils"><b>Tableau des seuils</b><span>Graphiques et détail</span></a>' +
          '<a href="#utilisation"><b>Utilisation</b><span>Plus et moins utilisés</span></a>' +
          '<a href="#saisie"><b>Saisie rapide</b><span>Stock et seuils en masse</span></a>' +
          '<a href="#historique"><b>Historique</b><span>Tous les mouvements</span></a>' +
        '</div></div></div>' +
        '<div class="box"><div class="hd">Aujourd\'hui</div><div class="bd"><div class="tiles">' +
          '<div class="tile"><b>' + out + '</b><span>outil(s) sorti(s)</span></div>' +
          '<div class="tile"><b>' + inn + '</b><span>outil(s) entré(s)</span></div>' +
          '<a class="tile" href="#seuils" style="text-decoration:none;color:inherit"><b>' + (under ? '<span style="color:var(--red)">▼</span> ' : '<span style="color:var(--green)">✓</span> ') + under + '</b><span>sous le seuil</span></a>' +
          '<div class="tile"><b>' + (nomach ? '<span style="color:var(--yellow)">▲</span> ' : '') + nomach + '</b><span>sortie(s) sans machine</span></div>' +
        '</div></div></div>' +
        '<div class="box"><div class="hd">Outils à réapprovisionner (' + restock.length + ')</div><div class="bd"><ul class="restock">' +
          (restock.length ? restock.map(function (t) { var s = status(t), st = S.status[t.ref]; return '<li><span>' + esc(t.ref) + ' <span class="muted">' + esc(t.label) + '</span>' + (st ? '<br><b style="font-size:13px">' + esc(st.statut) + '</b>' : '') + '</span><span><span class="pill ' + s.k + '">' + s.ic + ' ' + t.stock + ' / ' + t.seuil + '</span></span></li>'; }).join("") : '<li class="muted">Aucun outil sous ou proche du seuil.</li>') +
        '</ul></div></div>' +
      '</div>';
  }

  function donut(counts, total) {
    var R = 58, C = 2 * Math.PI * R, off = 0, segs = "";
    var parts = [["r", "var(--red)"], ["y", "var(--yellow)"], ["g", "var(--green)"], ["n", "var(--grey)"]];
    parts.forEach(function (p) {
      var n = counts[p[0]]; if (!n) { return; }
      var len = n / total * C, gap = total > n ? 2 : 0;
      segs += '<circle cx="80" cy="80" r="' + R + '" fill="none" stroke="' + p[1] + '" stroke-width="24" stroke-dasharray="' + Math.max(len - gap, 0.1) + ' ' + (C - Math.max(len - gap, 0.1)) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 80 80)"><title>' + n + ' outil(s)</title></circle>';
      off += len;
    });
    return '<svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Répartition des outils par état">' + segs +
      '<text x="80" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="#17202c">' + total + '</text><text x="80" y="102" text-anchor="middle" font-size="12" fill="#5d6877">outils</text></svg>';
  }

  function histogram(list) {
    var W = 900, H = 300, L = 34, B = 34, T = 14, Rr = 8;
    var maxv = 0; list.forEach(function (t) { maxv = Math.max(maxv, t.stock, t.desired, t.seuil); });
    var top = Math.max(5, Math.ceil(maxv / 5) * 5), ph = H - B - T, pw = W - L - Rr;
    function y(v) { return T + ph - v / top * ph; }
    var bw = pw / list.length, s = "";
    for (var v = 0; v <= top; v += 5) {
      s += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e6e8ec"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#5d6877">' + v + '</text>';
    }
    var col = { r: "#d03b3b", y: "#fab219", g: "#0ca30c", n: "#8a8a86" };
    list.forEach(function (t, i) {
      var x = L + i * bw + bw * 0.18, w = bw * 0.64, h = t.stock / top * ph, y0 = T + ph, r = Math.min(4, w / 2, h);
      if (h > 0) {
        s += '<path d="M' + x + ',' + y0 + ' V' + (y0 - h + r) + ' Q' + x + ',' + (y0 - h) + ' ' + (x + r) + ',' + (y0 - h) + ' H' + (x + w - r) + ' Q' + (x + w) + ',' + (y0 - h) + ' ' + (x + w) + ',' + (y0 - h + r) + ' V' + y0 + ' Z" fill="' + col[status(t).k] + '"><title>' + t.ref + ' : stock ' + t.stock + ', seuil ' + t.seuil + ', désiré ' + t.desired + '</title></path>';
      }
      s += '<line x1="' + (L + i * bw + 2) + '" x2="' + (L + (i + 1) * bw - 2) + '" y1="' + y(t.seuil) + '" y2="' + y(t.seuil) + '" stroke="#263c5c" stroke-width="2"/>';
      s += '<line x1="' + (L + i * bw + 2) + '" x2="' + (L + (i + 1) * bw - 2) + '" y1="' + y(t.desired) + '" y2="' + y(t.desired) + '" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="4 3"/>';
      s += '<text x="' + (L + i * bw + bw / 2) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="11" fill="#5d6877">' + t.ref.slice(-4) + '</text>';
    });
    s += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '" stroke="#b7bdc6"/>';
    return '<div class="tablewrap"><svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;min-width:560px;height:auto" role="img" aria-label="Stock par outil">' + s + '</svg></div>';
  }

  function vSeuils() {
    var list = sorted(), counts = { r: 0, y: 0, g: 0, n: 0 };
    list.forEach(function (t) { counts[status(t).k]++; });
    var h = '<h1>Tableau des seuils</h1><div class="charts">' +
      '<div class="box"><div class="hd">Répartition des outils</div><div class="bd">' + donut(counts, list.length) +
        '<div class="donutleg">' +
          '<span><span class="pill r">▼ ' + counts.r + '</span> Sous le seuil</span>' +
          '<span><span class="pill y">▲ ' + counts.y + '</span> Proche du seuil</span>' +
          '<span><span class="pill g">✓ ' + counts.g + '</span> OK</span>' +
          '<span><span class="pill n">– ' + counts.n + '</span> Pas de seuil</span>' +
        '</div></div></div>' +
      '<div class="box"><div class="hd">Stock par outil <span class="muted">(références OUT-…)</span></div><div class="bd">' +
        '<div class="legend"><span><i style="background:var(--red)"></i>Sous le seuil</span><span><i style="background:var(--yellow)"></i>Proche</span><span><i style="background:var(--green)"></i>OK</span><span><i style="background:var(--navy);height:3px;vertical-align:3px"></i>Seuil mini</span><span><i style="background:none;border-top:2px dashed #8a94a3;height:0;vertical-align:3px"></i>Stock désiré</span></div>' +
        histogram(list) + '</div></div></div>';
    // Résumé du suivi de réapprovisionnement : combien d'outils pour chaque état
    var tracked = {}, nostatus = 0;
    list.forEach(function (t) {
      var k = status(t).k;
      if (k === "r" || k === "y") { var st = S.status[t.ref]; if (st) { tracked[st.statut] = (tracked[st.statut] || 0) + 1; } else if (k === "r") { nostatus++; } }
    });
    if (counts.r + counts.y > 0) {
      h += '<h2>Suivi du réapprovisionnement</h2><div class="tiles">' +
        '<div class="tile"><b style="color:var(--red)">' + nostatus + '</b><span>▼ sous le seuil, <strong>sans suivi</strong></span></div>' +
        STATUTS.map(function (n) { return '<div class="tile"><b>' + (tracked[n] || 0) + '</b><span>' + esc(n) + '</span></div>'; }).join("") + '</div>';
    }
    function suiviCell(t, k) {
      if (k !== "r" && k !== "y") { return ""; }
      var st = S.status[t.ref];
      return '<select data-st="' + esc(t.ref) + '" aria-label="Suivi de ' + esc(t.ref) + '" style="min-width:0;width:178px;height:34px;font-size:14px"><option value="">' + (k === "r" ? "— sans suivi —" : "— pas encore —") + '</option>' +
        STATUTS.map(function (n) { return '<option' + (st && st.statut === n ? " selected" : "") + '>' + esc(n) + '</option>'; }).join("") + '</select> ' +
        '<input type="text" data-note="' + esc(t.ref) + '" maxlength="255" placeholder="Note (fournisseur, date…)" value="' + esc(st ? st.note : "") + '" style="width:130px;height:34px;font:inherit;font-size:14px;padding:0 8px;border:1px solid #c9cfd8;border-radius:8px">' +
        (st ? '<div class="muted" style="font-size:12.5px">mis à jour le ' + fmtDate(st.t) + '</div>' : "");
    }
    h += '<div class="box"><div class="hd">Détail</div><div class="tablewrap"><table><thead><tr><th>État</th><th>Référence</th><th>Désignation</th><th class="num">Stock</th><th class="num">Seuil mini</th><th class="num">Stock désiré</th><th class="num">À commander</th><th>Suivi du réapprovisionnement</th></tr></thead><tbody>' +
      list.map(function (t) { var s = status(t), cmd = (s.k === "r" || s.k === "y") ? Math.max(t.desired - t.stock, 0) : ""; return '<tr class="' + s.k + '"><td><span class="pill ' + s.k + '">' + s.ic + ' ' + s.txt + '</span></td><td>' + esc(t.ref) + '</td><td>' + esc(t.label) + '</td><td class="num"><b>' + t.stock + '</b></td><td class="num">' + t.seuil + '</td><td class="num">' + t.desired + '</td><td class="num"><b>' + cmd + '</b></td><td>' + suiviCell(t, s.k) + '</td></tr>'; }).join("") +
      '</tbody></table></div></div><p class="muted" style="font-size:13.5px">Rouge : stock sous le seuil mini. Jaune : jusqu\'à 50 % au-dessus du seuil. « À commander » = stock désiré − stock.</p>';
    return h;
  }

  /* ---------- Scan par OF : on scanne tous les outils, on ajuste les quantités, on valide d'un coup (comme of.php) ---------- */
  function ofRead() {   // reprend à l'écran le n° d'OF, la machine et les quantités (sinon un scan effacerait une quantité modifiée)
    var no = document.getElementById("ofno"), mc = document.getElementById("ofmachine");
    if (no) { S.of.no = no.value.replace(/[^A-Za-z0-9 _\-\/\.]/g, "").slice(0, 40); }
    if (mc) { S.of.machine = mc.value; }
    document.querySelectorAll("[data-ofqty]").forEach(function (i) {
      S.of.lines.forEach(function (l) { if (l.ref === i.getAttribute("data-ofqty")) { var q = parseInt(i.value, 10); l.qty = q > 0 ? Math.min(q, 999) : 1; } });
    });
  }
  function ofAdd(code) {
    ofRead(); ofCands = null; ofResult = null; ofFlash = null;
    code = String(code).trim().toUpperCase();
    if (!code) { return; }
    var t = tool(code);
    if (!t && code.length >= 2) {
      var m = S.tools.filter(function (x) { return x.ref.slice(-code.length) === code; });
      if (m.length === 1) { t = m[0]; } else if (m.length > 1) { ofCands = { code: code, list: m }; render(); return; }
    }
    if (!t) { ofFlash = { ok: false, msg: "Code inconnu : « " + code + " ». Vérifiez l'étiquette ou tapez la référence de l'outil." }; beep(false); render(); return; }
    var line = null;
    S.of.lines = S.of.lines.filter(function (l) { if (l.ref === t.ref) { line = l; return false; } return true; });
    if (line) { line.qty = Math.min(999, line.qty + 1); } else { line = { ref: t.ref, label: t.label, qty: 1 }; }
    S.of.lines.unshift(line);   // le dernier outil scanné passe en tête de liste
    ofFlash = { ok: true, msg: t.ref + " ajouté (quantité : " + line.qty + ")" };
    ofUndoInfo = null; save(); beep(true); render();
  }
  function ofValidate() {
    ofRead(); ofFlash = null; ofCands = null;
    var o = S.of, problems = [];
    if (!o.lines.length) { problems.push("La liste est vide : scannez au moins un outil."); }
    if (o.sens === 1) { o.lines.forEach(function (l) { var t = tool(l.ref); if (l.qty > t.stock) { problems.push(l.ref + " : il ne reste que " + t.stock + " en stock (demandé : " + l.qty + ")."); } }); }
    if (problems.length) { ofResult = { ok: false, msg: "Rien n'a été enregistré.", list: problems }; beep(false); render(); return; }
    var total = 0, warn = [], prefix = (o.sens === 1 ? "Sortie" : "Entrée") + (o.no ? " OF " + o.no : " scan");
    o.lines.forEach(function (l) {
      total += l.qty;
      var t = tool(l.ref); move(t, l.qty, o.sens, o.machine, prefix);
      if (o.sens === 1 && t.seuil > 0 && t.stock < t.seuil) { warn.push(t.ref + " est sous son seuil (" + t.stock + " / mini " + t.seuil + ")."); }
    });
    ofUndoInfo = { no: o.no, sens: o.sens, machine: o.machine, lines: o.lines.map(function (l) { return { ref: l.ref, qty: l.qty }; }) };
    ofResult = { ok: true, msg: (o.sens === 1 ? "Sortie" : "Entrée") + " enregistrée" + (o.no ? " pour l'OF " + o.no : "") + " : " + o.lines.length + " outil(s), " + total + " pièce(s).", warn: warn, undo: true };
    o.lines = []; o.no = ""; save(); beep(true); render();
  }
  function ofUndo() {
    var u = ofUndoInfo; ofUndoInfo = null; ofFlash = null;
    if (!u) { ofResult = { ok: false, msg: "Rien à annuler (déjà annulé ou trop ancien)." }; render(); return; }
    var rev = u.sens === 1 ? 0 : 1, problems = [];
    if (rev === 1) { u.lines.forEach(function (l) { var t = tool(l.ref); if (l.qty > t.stock) { problems.push(l.ref + " : il ne reste que " + t.stock + " en stock (à retirer : " + l.qty + ")."); } }); }
    if (problems.length) { ofResult = { ok: false, msg: "Annulation impossible, rien n'a été modifié.", list: problems }; beep(false); render(); return; }
    u.lines.forEach(function (l) { move(tool(l.ref), l.qty, rev, u.machine, "Annulation " + (u.sens === 1 ? "sortie" : "entrée") + (u.no ? " OF " + u.no : " scan")); });
    ofResult = { ok: true, msg: (u.no ? "OF " + u.no : "Mouvement") + " annulé : " + (u.sens === 1 ? "sortie" : "entrée") + " de " + u.lines.length + " outil(s) corrigée." };
    beep(true); render();
  }

  function vOf() {
    var o = S.of, out = o.sens === 1, pieces = 0, h = '<h1>Scan entrée / sortie</h1><div class="scanwrap" style="max-width:900px">';
    o.lines.forEach(function (l) { pieces += l.qty; });
    function ul(a) { return a && a.length ? '<ul style="margin:6px 0 0 18px;padding:0">' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>' : ""; }
    if (ofResult) {
      h += '<div class="banner ' + (ofResult.ok ? "ok" : "ko") + '" role="status"><span class="ic">' + (ofResult.ok ? "✓" : "✕") + '</span><div class="grow"><b>' + esc(ofResult.msg) + '</b>' + ul(ofResult.list) + '</div>' +
        (ofResult.undo && ofUndoInfo ? '<button type="button" class="btn-undo" id="ofundo">↶ Annuler ce mouvement</button>' : '') + '</div>';
      if (ofResult.warn && ofResult.warn.length) { h += '<div class="banner warn"><span class="ic">▲</span><div class="grow"><b>Réapprovisionnement à prévoir :</b>' + ul(ofResult.warn) + '</div></div>'; }
    }
    if (ofFlash) { h += '<div class="banner ' + (ofFlash.ok ? "ok" : "ko") + '" role="status"><span class="ic">' + (ofFlash.ok ? "✓" : "✕") + '</span><div class="grow"><b>' + esc(ofFlash.msg) + '</b></div></div>'; }
    h += '<form id="ofform" autocomplete="off">' +
      '<input type="submit" value="OK" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">' +
      '<div class="row" style="justify-content:flex-start;margin-bottom:14px;gap:16px">' +
        '<label class="muted" style="display:flex;flex-direction:column;gap:4px;font-size:13.5px">N° d\'OF (facultatif)<input type="text" id="ofno" maxlength="40" placeholder="ex. 12345" value="' + esc(o.no) + '" style="font:inherit;font-size:16px;height:42px;padding:0 10px;border:1px solid #bbb;border-radius:8px;width:170px"></label>' +
        '<span class="row sens"><button type="button" class="o' + (out ? " on" : "") + '" data-ofsens="1">⬆ Sortie</button><button type="button" class="i' + (!out ? " on" : "") + '" data-ofsens="0">⬇ Entrée (retour, réception)</button></span>' +
        '<label class="muted" style="display:flex;flex-direction:column;gap:4px;font-size:13.5px">Machine<select id="ofmachine"><option value="">Aucune</option>' + MACHINES.map(function (m) { return '<option' + (o.machine === m ? " selected" : "") + '>' + esc(m) + '</option>'; }).join("") + '</select></label>' +
      '</div>';
    if (ofCands) {
      h += '<div class="banner warn"><span class="ic">?</span><div class="grow"><b>Plusieurs outils correspondent à « ' + esc(ofCands.code) + ' »</b>. Choisissez :</div></div><div class="box cands" style="margin-bottom:14px">' +
        ofCands.list.map(function (t) { return '<button type="button" data-ofpick="' + esc(t.ref) + '"><b>' + esc(t.ref) + '</b> <span class="muted">' + esc(t.label) + '</span></button>'; }).join("") + '</div>';
    }
    h += '<div class="zone ' + (out ? "out" : "in") + '" style="margin-bottom:16px">' +
      '<div class="state"><span class="dot"></span><span>' + (out ? "Scannez les outils à SORTIR" : "Scannez les outils ENTRÉS (retour ou réception)") + '</span></div>' +
      '<input type="text" class="code" id="ofcode" placeholder="Code de l\'outil" aria-label="Code de l\'outil" enterkeyhint="go">' +
      '<p class="help"><b>Chaque scan ajoute l\'outil à la liste</b> (rien n\'est enregistré tout de suite). Scanner le même outil deux fois ajoute 1 à sa quantité. Un seul outil ? Scannez-le puis validez. Ici, tapez la référence (ou sa fin, ex. <b>0108</b>) puis Entrée, ou cliquez un outil ci-dessous.</p>' +
      '<div class="try"><span class="muted" style="font-size:13px">Simuler un scan :</span><div class="chips">' + S.tools.map(function (t) { return '<button type="button" data-ofscan="' + esc(t.ref) + '">' + esc(t.ref.slice(-4)) + '</button>'; }).join("") + '</div></div>' +
    '</div>';
    h += '<h2 style="margin-bottom:8px">Outils à enregistrer ' + (o.no ? '<span class="muted">OF ' + esc(o.no) + '</span> ' : '') + '<span class="muted" style="font-weight:400">(' + o.lines.length + ' outil(s), ' + pieces + ' pièce(s))</span></h2>';
    if (!o.lines.length) { h += '<p class="muted">La liste est vide. Le dernier outil scanné apparaît en haut.</p>'; }
    else {
      h += '<div class="box"><div class="tablewrap"><table><thead><tr><th>Référence</th><th>Désignation</th><th class="num">En stock</th><th style="text-align:center">Quantité</th><th></th></tr></thead><tbody>' +
        o.lines.map(function (l) {
          var t = tool(l.ref), bad = out && l.qty > t.stock;
          return '<tr><td><b>' + esc(l.ref) + '</b></td><td>' + esc(l.label) + '</td><td class="num">' + t.stock + (bad ? ' <span style="color:var(--red)">▼ insuffisant</span>' : '') + '</td>' +
            '<td style="text-align:center"><input type="number" class="qty" data-ofqty="' + esc(l.ref) + '" min="1" max="999" step="1" value="' + l.qty + '" aria-label="Quantité de ' + esc(l.ref) + '" style="height:38px;font-size:18px' + (bad ? ';border-color:var(--red);background:#fbeaea' : '') + '"></td>' +
            '<td style="text-align:center"><button type="button" data-ofrm="' + esc(l.ref) + '" title="Retirer de la liste" aria-label="Retirer ' + esc(l.ref) + '" style="background:none;border:0;cursor:pointer;font-size:18px;opacity:.6">✕</button></td></tr>';
        }).join("") + '</tbody></table></div></div>' +
        '<div class="row" style="justify-content:space-between;margin-top:14px"><button type="button" class="btn-undo" id="ofclear">Vider la liste</button>' +
        '<button type="button" class="btn-save" id="ofvalidate" style="background:' + (out ? "var(--red-btn)" : "var(--green-btn)") + '">✔ Valider : ' + (out ? "sortie" : "entrée") + ' de ' + pieces + ' pièce(s)</button></div>';
    }
    h += '</form>';
    h += '<div class="box"><div class="hd">Derniers mouvements</div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Qui</th><th>Outil</th><th class="num">Qté</th><th>Libellé</th></tr></thead><tbody>' +
      S.moves.slice(0, 6).map(function (m) { return '<tr><td>' + fmtDate(m.t) + '</td><td>' + esc(m.who) + '</td><td>' + esc(m.ref) + '</td><td class="num ' + (m.qty > 0 ? "qplus" : "qmin") + '">' + (m.qty > 0 ? "+" : "") + m.qty + '</td><td>' + esc(m.label) + '</td></tr>'; }).join("") +
      '</tbody></table></div></div></div>';
    return h;
  }

  function wireOf() {
    var code = document.getElementById("ofcode");
    function on(sel, fn) { document.querySelectorAll(sel).forEach(function (b) { b.addEventListener("click", function () { fn(b); }); }); }
    document.getElementById("ofform").addEventListener("submit", function (e) { e.preventDefault(); ofAdd(code.value); });
    on("[data-ofsens]", function (b) { ofRead(); S.of.sens = +b.getAttribute("data-ofsens"); save(); render(); });
    on("[data-ofscan]", function (b) { ofAdd(b.getAttribute("data-ofscan")); });
    on("[data-ofpick]", function (b) { ofAdd(b.getAttribute("data-ofpick")); });
    on("[data-ofrm]", function (b) { ofRead(); var r = b.getAttribute("data-ofrm"); S.of.lines = S.of.lines.filter(function (l) { return l.ref !== r; }); ofFlash = { ok: true, msg: r + " retiré de la liste." }; ofResult = null; save(); render(); });
    var c = document.getElementById("ofclear"); if (c) { c.addEventListener("click", function () { if (confirm("Vider toute la liste ?")) { S.of.lines = []; S.of.no = ""; ofFlash = { ok: true, msg: "Liste vidée." }; ofResult = null; save(); render(); } }); }
    var v = document.getElementById("ofvalidate");
    if (v) { v.addEventListener("click", function () { ofRead(); var n = 0; S.of.lines.forEach(function (l) { n += l.qty; }); if (confirm((S.of.sens === 1 ? "Enregistrer la SORTIE" : "Enregistrer l'ENTRÉE") + " de " + n + " pièce(s) (" + S.of.lines.length + " outil(s)) ?")) { ofValidate(); } }); }
    var u = document.getElementById("ofundo"); if (u) { u.addEventListener("click", function () { if (confirm("Annuler ce mouvement ?")) { ofUndo(); } }); }
    document.querySelectorAll("#ofno, [data-ofqty]").forEach(function (i) { i.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); code.focus(); } }); i.addEventListener("change", function () { ofRead(); save(); }); });
    document.getElementById("ofmachine").addEventListener("change", function () { ofRead(); save(); code.focus(); });
    if (window.matchMedia("(min-width: 761px)").matches) { code.focus({ preventScroll: true }); }
  }

  function wireSeuils() {
    document.querySelectorAll("[data-st]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        var ref = sel.getAttribute("data-st"), note = document.querySelector('[data-note="' + ref + '"]').value.trim();
        if (sel.value === "") { delete S.status[ref]; } else { S.status[ref] = { statut: sel.value, note: note, t: nowIso() }; }
        save(); render();
      });
    });
    document.querySelectorAll("[data-note]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var ref = inp.getAttribute("data-note");
        if (S.status[ref]) { S.status[ref].note = inp.value.trim(); S.status[ref].t = nowIso(); save(); render(); }
      });
    });
  }

  /* ---------- Utilisation des outils : plus et moins utilisés (comme utilisation.php) ---------- */
  var usePer = 30;
  function vUtil() {
    var since = new Date(); since.setDate(since.getDate() - usePer); since.setMinutes(since.getMinutes() - since.getTimezoneOffset());
    var sinceIso = since.toISOString().slice(0, 19), total = 0;
    var rows = S.tools.map(function (t) {
      var exits = 0, cancels = 0, last = "";
      S.moves.forEach(function (m) {
        if (m.ref !== t.ref) { return; }
        var isExit = m.qty < 0 && m.label.indexOf("Annulation") !== 0 && m.label.indexOf("Inventaire") !== 0;
        if (isExit && m.t > last) { last = m.t; }
        if (m.t < sinceIso) { return; }
        if (isExit) { exits -= m.qty; }
        if (m.qty > 0 && m.label.indexOf("Annulation sortie") === 0) { cancels += m.qty; }
      });
      var used = Math.max(0, exits - cancels); total += used;
      return { t: t, used: used, last: last };
    });
    var most = rows.filter(function (r) { return r.used > 0; }).sort(function (a, b) { return b.used - a.used || a.t.ref.localeCompare(b.t.ref); });
    var least = rows.slice().sort(function (a, b) { return a.used - b.used || (a.last || "").localeCompare(b.last || "") || b.t.stock - a.t.stock || a.t.ref.localeCompare(b.t.ref); });
    var top = most.length ? most[0].used : 1;
    var h = '<h1>Utilisation des outils</h1><div class="row" style="justify-content:flex-start;margin-bottom:14px">' +
      '<span class="muted">Période :</span>' + [7, 30, 90].map(function (d) { return '<button type="button" class="btn-undo" data-per="' + d + '" style="font-weight:600;padding:8px 16px;border-width:2px;border-radius:10px;' + (d === usePer ? 'background:var(--navy);border-color:var(--navy);color:#fff' : '') + '">' + d + ' jours</button>'; }).join("") +
      '<span class="muted">Total sorti : <b>' + total + '</b> pièce(s)</span></div><div class="grid2">';
    h += '<div class="box"><div class="hd">Les plus utilisés (' + usePer + ' jours)</div><div class="bd">' +
      (most.length ? most.slice(0, 8).map(function (r) { return '<div class="bar" style="grid-template-columns:90px 1fr 28px"><span title="' + esc(r.t.label) + '">' + esc(r.t.ref) + '</span><span class="track"><span class="fill" style="display:block;width:' + Math.round(r.used / top * 100) + '%"></span></span><b>' + r.used + '</b></div>'; }).join("") : '<p class="muted">Aucune sortie sur cette période.</p>') +
      '</div></div>';
    h += '<div class="box"><div class="hd">Les moins utilisés (' + usePer + ' jours)</div><div class="tablewrap"><table><thead><tr><th>Outil</th><th class="num">Sorti</th><th>Dernière sortie</th><th class="num">Stock</th></tr></thead><tbody>' +
      least.slice(0, 8).map(function (r) { return '<tr><td>' + esc(r.t.ref) + ' <span class="muted">' + esc(r.t.label) + '</span></td><td class="num">' + (r.used ? '<b>' + r.used + '</b>' : '<span class="muted">0</span>') + '</td><td>' + (r.last ? fmtDate(r.last).slice(0, 10) : '<span class="muted">jamais sorti</span>') + '</td><td class="num">' + r.t.stock + '</td></tr>'; }).join("") +
      '</tbody></table></div></div></div>' +
      '<p class="muted" style="font-size:13.5px">Utilisation = pièces sorties du magasin sur la période, sans les corrections d\'inventaire et sans les sorties annulées. Un outil très stocké mais rarement sorti est un candidat pour réduire son stock désiré ; un outil très utilisé avec peu de stock mérite un seuil mini plus haut.</p>';
    return h;
  }
  function wireUtil() {
    document.querySelectorAll("[data-per]").forEach(function (b) { b.addEventListener("click", function () { usePer = +b.getAttribute("data-per"); render(); }); });
  }

  function vHisto() {
    return '<h1>Historique des mouvements</h1><p class="intro">Qui, quand, quel outil, combien et pour quelle machine. Les annulations restent visibles.</p>' +
      '<div class="box"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Qui</th><th>Outil</th><th class="num">Qté</th><th>Libellé</th></tr></thead><tbody>' +
      S.moves.map(function (m) { return '<tr><td>' + fmtDate(m.t) + '</td><td>' + esc(m.who) + '</td><td>' + esc(m.ref) + '</td><td class="num ' + (m.qty > 0 ? "qplus" : "qmin") + '">' + (m.qty > 0 ? "+" : "") + m.qty + '</td><td>' + esc(m.label) + '</td></tr>'; }).join("") +
      '</tbody></table></div></div>';
  }

  // Même logique que inventaire.php : un écart de stock devient un mouvement « Inventaire », seuil/désiré mis à jour
  var saisieMsg = null;
  function vSaisie() {
    var h = '<h1>Saisie rapide : stock et seuils</h1>' +
      '<p class="intro">Tapez le <b>stock compté</b> en magasin pour chaque outil, puis réglez le <b>seuil mini</b> et le <b>stock désiré</b>. Laissez « Stock compté » vide pour ne pas toucher au stock ; videz un seuil pour le supprimer. Un seul bouton enregistre tout ; chaque écart de stock est tracé dans l\'historique comme « Inventaire ».</p>';
    if (saisieMsg) { h += '<div class="banner ok"><span class="ic">✓</span><div class="grow">' + esc(saisieMsg) + '</div></div>'; saisieMsg = null; }
    h += '<form id="saisieform" autocomplete="off"><div class="box"><div class="tablewrap"><table class="inv"><thead><tr><th>Référence</th><th>Désignation</th><th class="num">Stock actuel</th><th class="num">Stock compté</th><th class="num">Seuil mini</th><th class="num">Stock désiré</th></tr></thead><tbody>' +
      S.tools.slice().sort(function (a, b) { return a.ref.localeCompare(b.ref); }).map(function (t) {
        var sv = t.seuil > 0 ? t.seuil : "", dv = t.desired > 0 ? t.desired : "";
        return '<tr><td>' + esc(t.ref) + '</td><td>' + esc(t.label) + '</td><td class="num">' + t.stock + '</td>' +
          '<td class="num"><input type="number" min="0" step="1" data-f="counted" data-ref="' + esc(t.ref) + '" placeholder="' + t.stock + '"></td>' +
          '<td class="num"><input type="number" min="0" step="1" data-f="seuil" data-ref="' + esc(t.ref) + '" data-orig="' + sv + '" value="' + sv + '"></td>' +
          '<td class="num"><input type="number" min="0" step="1" data-f="desired" data-ref="' + esc(t.ref) + '" data-orig="' + dv + '" value="' + dv + '"></td></tr>';
      }).join("") +
      '</tbody></table></div></div><p style="text-align:center;margin:16px 0"><button type="submit" class="btn-save">Enregistrer tout</button></p></form>';
    return h;
  }

  function wireSaisie() {
    var form = document.getElementById("saisieform");
    form.querySelectorAll("input").forEach(function (el) {
      el.addEventListener("input", function () {
        var orig = el.dataset.orig !== undefined ? el.dataset.orig : "";
        el.classList.toggle("changed", el.value !== orig);
      });
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var nbm = 0, nbs = 0, errs = [], plan = [];
      S.tools.forEach(function (t) {
        var c = form.querySelector('[data-f="counted"][data-ref="' + t.ref + '"]').value.trim();
        var s = form.querySelector('[data-f="seuil"][data-ref="' + t.ref + '"]').value.trim();
        var d = form.querySelector('[data-f="desired"][data-ref="' + t.ref + '"]').value.trim();
        var p = { t: t };
        if (c !== "") { var q = parseFloat(c); if (q < 0) { errs.push(t.ref + " : quantité négative ignorée"); } else if (q !== t.stock) { p.stock = q; } }
        var sv = s === "" ? 0 : parseInt(s, 10), dv = d === "" ? 0 : parseInt(d, 10);
        if (sv < 0 || dv < 0) { errs.push(t.ref + " : valeur négative ignorée"); }
        else { if (sv !== (t.seuil || 0)) { p.seuil = sv; } if (dv !== (t.desired || 0)) { p.desired = dv; } }
        plan.push(p);
      });
      if (errs.length) { saisieMsg = null; alert("Rien n'a été enregistré à cause d'erreurs :\n" + errs.join("\n")); return; }
      plan.forEach(function (p) {
        if (p.stock !== undefined) {
          var delta = p.stock - p.t.stock;
          S.moves.unshift({ t: nowIso(), ref: p.t.ref, qty: delta, label: "Inventaire (saisie rapide) : " + p.t.stock + " → " + p.stock, who: "vous (démo)" });
          p.t.stock = p.stock; nbm++;
        }
        if (p.seuil !== undefined) { p.t.seuil = p.seuil; nbs++; }
        if (p.desired !== undefined) { p.t.desired = p.desired; nbs++; }
      });
      cleanStatus();
      save();
      saisieMsg = "Enregistré : " + nbm + " mouvement(s) de stock, " + nbs + " seuil(s) modifié(s).";
      render(); window.scrollTo(0, 0);
    });
  }

  var VIEWS = { accueil: vAccueil, scan: vOf, of: vOf, seuils: vSeuils, utilisation: vUtil, saisie: vSaisie, historique: vHisto };
  function current() { var h = location.hash.replace("#", ""); return VIEWS[h] ? h : "accueil"; }

  function render() {
    var v = current(), el = document.getElementById("view");
    cleanStatus();
    el.innerHTML = VIEWS[v]();
    document.querySelectorAll("nav a").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-v") === (v === "of" ? "scan" : v)); });
    if (v === "scan" || v === "of") { wireOf(); }
    if (v === "seuils") { wireSeuils(); }
    if (v === "utilisation") { wireUtil(); }
    if (v === "saisie") { wireSaisie(); }
  }

  document.getElementById("reset").addEventListener("click", function () {
    S = fresh(); ofFlash = null; ofResult = null; ofUndoInfo = null; ofCands = null; save(); render();
  });
  window.addEventListener("hashchange", function () { ofFlash = null; ofResult = null; ofCands = null; render(); window.scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>
